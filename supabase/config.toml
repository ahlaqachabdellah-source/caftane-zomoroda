# Supabase CLI configuration — Moroccan Caftan Rental
# Used when linking/pushing to the real Supabase project:
#   supabase link --project-ref <your-project-ref>
#   supabase db push
#   supabase db seed   (applies seed.sql)
project_id = "caftan-rental"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Rate limits enforced by Supabase Auth (GoTrue) on the hosted project and
# local `supabase start` — Phase 13 hardening against credential brute-force
# and confirmation/recovery email flooding. Values are per-hour per-IP and
# stay well above normal usage. (The embedded DB test harness does not
# parse this file.)
[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150

[auth.email.template.confirmation]
subject = "Confirmez votre inscription — Caftan Zomoroda"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe — Caftan Zomoroda"
content_path = "./templates/recovery.html"

[storage]
enabled = true
file_size_limit = "50MiB"
