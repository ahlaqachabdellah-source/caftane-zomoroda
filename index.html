<!doctype html>
<html lang="fr">
  <head>
    <meta name="google-site-verification" content="CBURnUEbJ790P1pYZNAbmf7Fg7NLPtDMyrUVgoklKvw" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Phase 15: no static <title>/<meta description> here on purpose.
      React 19 hoists the per-page localized tags rendered by
      src/components/seo/Seo.tsx into <head>; a static copy would remain
      alongside them and produce duplicate title/description tags.
      Crawlers get rendered metadata from the prerendered snapshots
      (scripts/prerender.mjs) and from executing the SPA (Googlebot).
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <meta name="theme-color" content="#16302b" />
    <!--
      Phase 14: only the weights the design system actually uses
      (audit: font-medium/semibold + body text; no font-bold anywhere).
      Display faces render semibold headings only. display=swap keeps
      text visible during font load; Google serves unicode-range subsets.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&family=Amiri:wght@700&family=Cairo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
