# Phase 16 — CI test workflow.
# Runs the portable, critical checks on every push/PR:
# lint → typecheck → unit tests (Vitest) → DB/RLS suite (embedded Postgres)
# → production build. The Playwright E2E harnesses (journey, a11y,
# responsive, per-phase regressions) run locally/pre-release because they
# need a Chromium runtime and a preview server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc -b

      - name: Unit tests
        run: npm run test

      - name: Database / RLS test suite
        run: npm run test:db

      - name: Production build
        run: npm run build
        env:
          # Build must succeed without backend env (frontend guards on it)
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
